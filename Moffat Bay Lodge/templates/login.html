<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Moffat Bay Lodge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About Us</a>
        <a href="{{ url_for('contact') }}">Contact Us</a>
        <a href="{{ url_for('reservation') }}">Reservation</a>
        <a href="{{ url_for('lookup') }}">Reservation Lookup</a>
        <a href="{{ url_for('attractions') }}">Attractions</a>
        <a href="{{ url_for('login') }}" class="login-btn">Login</a>
    </nav>

    <main class="page-content">
        <section class="login-card" aria-labelledby="login-heading">

            <h1 id="login-heading">Customer Login</h1>

            <p class="intro">
                Log in to make a reservation or view your reservation details.
            </p>

            {% if message %}
            <div class="message {{ message_type }}" role="alert">
                {{ message }}
            </div>
            {% endif %}

            <form action="/login" method="POST">

                <label for="email">Email Address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required>

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required>

                <button type="submit">Login</button>

            </form>

            <p class="help-text">
                Do not have an account?
                <a href="{{ url_for('registration') }}">Create an Account</a>
            </p>

            <p class="help-text">
                Need to find a reservation?
                <a href="{{ url_for('lookup') }}">Look Up Reservation</a>
            </p>

        </section>
    </main>

</body>
</html>
