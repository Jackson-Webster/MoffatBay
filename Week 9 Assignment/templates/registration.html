<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registration.css') }}">
</head>
<body>

    <!-- NAV BAR! -->
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About Us</a>
        <a href="{{ url_for('contact') }}">Contact Us</a>
        <a href="{{ url_for('reservation') }}">Reservation</a>
        <a href="{{ url_for('lookup') }}">Reservation Lookup</a>
        <a href="{{ url_for('attractions') }}">Attractions</a>
        <a href="{{ url_for('login') }}" class="login-btn">Login</a>
    </nav>

    <h1>Create an Account!</h1>

    <p>
        Fill out the form below to create an account and make a reservation today!
    </p>

    <!-- da form-->
    <form action="/register" method="POST">

        <label>First Name:</label><br>
        <input type="text" name="firstName" required><br><br>

        <label>Last Name:</label><br>
        <input type="text" name="lastName" required><br><br>

        <label>Email Address:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phoneNumber" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Register</button>

    </form>

    <!-- Back to login in case they forgot they had an account hehe-->
    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</body>
</html>
