<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reservation.css') }}">
</head>
<body>

    <!-- NAV BAR! -->
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About Us</a>
        <a href="{{ url_for('contact') }}">Contact Us</a>
        <a href="{{ url_for('reservation') }}">Reservation</a>
        <a href="{{ url_for('lookup') }}">Reservation Lookup</a>
        <a href="{{ url_for('attractions') }}">Attractions</a>
        <a href="{{ url_for('login') }}" class="login-btn">Login</a>
    </nav>

    <h1>Book Your Stay!</h1>

    <p>
        Fill out the form below to reserve your room.
    </p>

    <!-- Da form -->
    <form action="/reserve" method="POST">

        <!-- Customer ID -->
        <label>Customer ID:</label><br>
        <input type="number" name="customerID" required>

        <br><br>

        <!-- Room Size -->
        <label>Room Type:</label><br>
        <select name="roomType" required>
            <option value="">Select a Room</option>
            <option value="Double Full Beds">Double Full Beds: $67 per night</option>
            <option value="Queen">Queen: $101 per night</option>
            <option value="Double Queen Beds">Double Queen Beds: $140 per night</option>
            <option value="King">King: $160 per night</option>
        </select>

        <br><br>

        <!-- How many guests?!?! -->
        <label>Number of Guests:</label><br>
        <input type="number" name="guests" min="1" required>

        <br><br>

        <label>Check-In Date:</label><br>
        <input type="date" name="checkIn" required>

        <br><br>

        <label>Check-Out Date:</label><br>
        <input type="date" name="checkOut" required>

        <br><br>

        <label>Special Requests:</label><br>
        <textarea
            name="specialRequests"
            rows="4"
            placeholder="Enter any special requests here..."></textarea>

        <br><br>

        <!-- Fake button will add one later U_U -->
        <button type="submit">Continue</button>

    </form>

    <!-- THIS IS WHERE THE RESERVATION SUMMARY SHOULD BE CONNECTED!!! :D -->
    <!-- yooo also the summary should definitely have the back to home button-->

    <!-- Will there be a user tab where it says to view their reservations? or smth like that? -->

</body>
</html>
